[main]
terminal=foot
enable-mouse=no
match-mode=exact
filter-desktop=yes
anchor=bottom-left
font=JetBrains Mono NL:style=Regular:size=10.5
prompt=""
fields=name
lines=7
width=35
horizontal-pad=12
vertical-pad=12
inner-pad=6
icons-enabled=false

[border]
width=1
radius=0
selection-radius=0

[colors]
background=141617FF
input=DDC7A1FF
text=DDC7A1FF
selection=DDC7A1FF
selection-text=141617FF
border=DDC7A1FF
match=141617FF
selection-match=141617FF
