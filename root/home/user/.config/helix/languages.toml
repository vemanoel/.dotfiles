[language-server.gopls]
command = "gopls"

[language-server.gopls.config]
diagnosticsDelay = "1s"
hoverKind = "SingleLine"
diagnosticsTrigger = "Edit"
staticcheck = true
semanticTokens = false
usePlaceholders = false
verboseOutput = true
completeUnimported = true

[language-server.gopls.config.analyses]
newexpr = false
shift = true
unusedvariable = true
nilness = true
unusedparams = true
unusedwrite = true
useany = true
shadow = true
slicesdelete = true
ST1000 = false
ST1003 = false

[[language]]
name = "go"
auto-format = true
language-servers = ["gopls"]
roots = ["go.work", "go.mod"]
formatter = { command = "gofmt", args = ["-s"] }

[[language]]
name = "gomod"
auto-format = true
language-servers = ["gopls"]

[[language]]
name = "gowork"
auto-format = true
language-servers = ["gopls"]

[[language]]
name = "json"
formatter = { command = "jq", args = [".", "--indent", "4", "--tab"] }
