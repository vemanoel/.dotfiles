[main]
terminal=foot

enable-mouse=no

match-mode=exact
filter-desktop=yes

font=Iosevka Aile:size=10
prompt="> "
fields=name
lines=7
width=35
horizontal-pad=12
vertical-pad=12
inner-pad=6
icons-enabled=false

[border]
width=1
radius=0
selection-radius=0

[colors]
background=282828ff
text=ddc7a1ff
match=a9b665ff
selection=a9b665ff
selection-text=32302fff
border=a9b665ff
