[theme]
border = "yellow"
text = "white"
prompt = "darkgray"
time = "green"
action = "yellow"
button = "black"
container = "darkgray"
input = "white"

[layout]
width = 60
window_padding = 2
container_padding = 1
prompt_padding = 1

[display]
show_time = true
issue = false
greeting = "Welcome to the system!"
align_greeting = "center"

[layout.widgets]
time_position = "top"
status_position = "bottom"

[secret]
mode = "characters"
characters = "*"

[remember]
username = true
session = false
user_session = true

[user_menu]
enabled = true
min_uid = 1000
max_uid = 60000

[keybindings]
command = 2     # F2
sessions = 3    # F3
background = 4  # F4
power = 12      # F12
