[main]
font=Iosevka Aile:size=10
prompt="> "
enable-mouse=no
icons-enabled=false
match-mode=exact
fields=name
width=35
lines=7
horizontal-pad=12
vertical-pad=12
inner-pad=6
filter-desktop=yes
terminal=alacritty --command

[border]
width=1
radius=0
selection-radius=0

[colors]
background=282828ff
text=ddc7a1ff
match=a9b665ff
selection=a9b665ff
selection-text=32302fff
border=a9b665ff
